services:
  portfolio:
    image: ${DOCKER_IMAGE_NAME}:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
