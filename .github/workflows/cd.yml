name: Main Branch CD Pipeline
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Choose the deployment environment'
        required: true
        type: choice
        options:
          - production
          - staging
          - development
        default: 'production'
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and Push Docker Image
        run: |
          docker build --build-arg ENV=${{ github.event.inputs.environment }} \
          -t ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/portfolio:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ secrets.SSH_KNOWN_HOSTS }}
          if_key_exists: replace
      - name: Copy docker-compose.yaml to VPS
        run: |
          rsync -avz --chmod=600 docker-compose.yaml ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }}:~/apps/portfolio/docker-compose.yaml
      - name: Pull Image & Deploy to VPS
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USERNAME }}@${{ secrets.VPS_IP }} "\
            cd ~/apps/portfolio && \
            
            # Remove any existing .env file to avoid conflicts
            rm -f .env && \

            # Create a new .env file with the necessary environment variables for Docker Compose
            echo 'DOCKER_IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/portfolio' > .env && \
            
            # Set permissions for .env file
            chmod 600 .env && \

            # Pull the latest image, start the container, and clean up unused images  
            docker compose pull && \
            docker compose up -d && \
            docker image prune -f"
